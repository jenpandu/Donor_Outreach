[project]
name= "donor_outreach"
version = "0.1.0"
description = "Donor outreach program"
requires-python = ">=3.11"

dependencies = [
    "flask>=3.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "flask-sqlalchemy>=3.1",
    "flask-migrate>=4.0",
    "psycopg[binary]>=3.1",
    "python-dotenv>=1.0",
    "faker>=25.0",
    "boto3>=1.34",
    "python-dotenv>=1.0",
    "structlog>=24.1",
    "gunicorn>=22.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pillow>=10.0"
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["donor_outreach*"]
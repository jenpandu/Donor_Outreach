services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: paint
      POSTGRES_DB: donor_outreach
    ports:
      - "5433:5432"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: .
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:paint@db:5432/donor_outreach
      AWS_PROFILE: donor_outreach
      AWS_REGION: us-east-1
    volumes:
      - ~/.aws:/root/.aws:ro
    depends_on:
      db:
        condition: service_healthy
